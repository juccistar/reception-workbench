<div class="studio" id="studio">
  <div class="preview-heading"><strong><span class="preview-bullet"></span>启动台 · 交互设计稿</strong><a href="chat-sidebar.html">客户侧栏预览 ↗</a></div>
  <main class="app-frame" id="app" aria-label="接待工作台设计预览">
    <div id="home" style="display:contents">
      <header class="app-header"><div class="app-heading"><span class="app-mark"><svg><use href="#i-grid"/></svg></span><h1>接待工作台</h1></div><div class="toolbar"><button class="icon-button outlined" data-action="global-settings" aria-label="设置" title="设置"><svg><use href="#i-gear"/></svg></button><button class="button primary" data-action="add"><svg><use href="#i-plus"/></svg>添加账号</button></div></header>
      <div class="tab-bar"><nav class="tabs" role="tablist" aria-label="账号类型" id="tabs"></nav><span class="list-caption">账号</span></div>
      <section class="account-list" id="accounts" aria-label="账号列表"></section>
      <footer class="app-footer"><span id="total"></span><button class="text-button" data-action="global-settings" id="model-state"></button></footer>
    </div>
    <div id="sheet-root"></div><div id="dialog-root"></div><div id="toast" class="toast" role="status" hidden></div>
  </main>
  <aside class="prototype-tools" aria-label="设计稿预览工具"><span>预览状态</span><button data-scenario="normal" aria-pressed="true">正常</button><button data-scenario="multi" aria-pressed="false">多账号在线</button><button data-scenario="qr" aria-pressed="false">等待扫码</button><button data-scenario="error" aria-pressed="false">连接失败</button><button data-scenario="pending" aria-pressed="false">发送结果待核查</button><button data-scenario="model" aria-pressed="false">模型未配置</button><span class="tool-divider"></span><button data-action="complete-scan">模拟扫码完成</button><button data-action="narrow" aria-pressed="false">窄窗口</button></aside>
  <p class="prototype-note">此处为独立交互稿，使用合成账号和联系人。预览操作不会连接账号、调用模型或发送消息。</p>
</div>
<script>
(() => {
  const $ = (selector, scope = document) => scope.querySelector(selector);
  const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => `<svg aria-hidden="true"><use href="#i-${name}"/></svg>`;
  const avatar = type => `<span class="platform-avatar ${type}">${icon(type === 'whatsapp' ? 'whatsapp' : 'global')}</span>`;
  const contactFixtures = () => [{id:'alex',name:'Alex',merchant:'intl-home',paused:false},{id:'morgan',name:'Morgan',merchant:'intl-home',paused:true},{id:'taylor',name:'Taylor',merchant:'',paused:true}];
  const fixtures = () => [
    {id:'intl-home',type:'international',name:'星野家居',company:'星野家居有限公司',tail:'2068',status:'opened',reception:true},
    {id:'wa-sales',type:'whatsapp',name:'海外业务',tail:'0186',status:'connected',reception:true,allowed:['intl-home'],defaultMerchant:'intl-home',legacy:'ready',pending:0,contacts:contactFixtures()},
    {id:'intl-factory',type:'international',name:'山禾制造',company:'山禾制造有限公司',tail:'7315',status:'authorize',reception:false},
    {id:'wa-support',type:'whatsapp',name:'售后服务',tail:'0429',status:'disconnected',reception:false,allowed:[],defaultMerchant:'',legacy:'ready',pending:0,contacts:contactFixtures()}
  ];
  let accounts = fixtures(), filter = 'all', modelReady = true, sheet = null, draft = null, baseline = '', dialogReturnFocus = null, toastTimer;
  let contactDraft = null, pendingSave = null;
  const account = id => accounts.find(a => a.id === id);
  const accountContacts = () => account(sheet?.id)?.contacts ?? [];
  const merchantName = id => account(id)?.name || '未分配';
  const statusData = a => a.type === 'international' ? a.status === 'opened' ? ['已打开','good'] : ['待授权','warn'] : ({connected:['已连接','good'],disconnected:['未连接',''],qr:['等待扫码','loading'],error:['连接超时','error']})[a.status];
  const status = a => { const [name, tone] = statusData(a); return `<span class="status ${tone}"${a.status === 'error' ? ' title="连接超时，请重试。"' : ''}><span class="status-dot"></span>${name}</span>`; };
  const statusSummary = a => `<div class="status-summary">${status(a)}${a.pending ? `<button class="pending-status" data-action="pending" data-id="${a.id}" title="消息已提交，发送结果尚未明确">${a.pending} 条待核查</button>` : ''}</div>`;
  const button = (label, action, extra = '', primary = false) => `<button class="button${primary ? ' primary' : ''}" data-action="${action}" ${extra}>${label}</button>`;
  const actionButton = a => a.type === 'international' ? a.status === 'opened' ? '打开窗口' : '授权' : a.status === 'connected' || a.status === 'qr' ? '打开窗口' : '连接';
  function renderHome() {
    $('#tabs').innerHTML = [['all','全部'],['international','国际站'],['whatsapp','WhatsApp']].map(([id, label]) => `<button class="tab" role="tab" aria-selected="${filter === id}" tabindex="${filter === id ? 0 : -1}" data-action="filter" data-filter="${id}">${label}<span class="tab-count">${id === 'all' ? accounts.length : accounts.filter(a => a.type === id).length}</span></button>`).join('');
    const items = accounts.filter(a => filter === 'all' || a.type === filter);
    $('#accounts').innerHTML = items.length ? items.map(a => `<article class="account-card" data-account="${a.id}">${avatar(a.type)}<div class="account-copy"><h2 class="account-name" title="${esc(a.name)}">${esc(a.name)}</h2><div class="account-meta"><span>${a.type === 'international' ? '国际站' : 'WhatsApp'}</span><span class="meta-divider">·</span><span>${a.tail ? '尾号 ' + a.tail : '待登录'}</span>${a.reception ? '<span class="meta-divider">·</span><span class="reception-label">自动接待中</span>' : ''}</div></div><div class="account-controls"><div class="status-edit">${statusSummary(a)}<button class="icon-button edit-account" data-action="edit" data-id="${a.id}" title="编辑账号" aria-label="编辑${esc(a.name)}">${icon('edit')}</button></div><button class="button account-open" data-action="open" data-id="${a.id}">${actionButton(a)}</button></div></article>`).join('') : `<div class="empty">${icon('accounts')}<p>还没有${filter === 'international' ? '国际站' : filter === 'whatsapp' ? ' WhatsApp ' : ''}账号</p>${button('添加账号','add')}</div>`;
    $('#total').textContent = `${items.length} 个账号`;
    $('#model-state').innerHTML = `<span class="status-dot" style="background:${modelReady ? '#7ca68e' : '#c5a165'}"></span>${modelReady ? '模型已就绪' : '模型未配置'} ${icon('right')}`;
  }
  function toast(message) { clearTimeout(toastTimer); $('#toast').textContent = message; $('#toast').hidden = false; toastTimer = setTimeout(() => $('#toast').hidden = true, 2300); }
  function setInert() { const overlay = !!$('#dialog-root').firstChild || !!$('#sheet-root').firstChild; $('#home').inert = overlay; const currentSheet = $('.sheet'); if (currentSheet) currentSheet.inert = !!$('#dialog-root').firstChild; }
  function sheetLayout(title, body, footer, back = '') {
    $('#sheet-root').innerHTML = `<div class="overlay" data-dismiss="sheet"><section class="sheet" role="dialog" aria-modal="true" aria-label="${title}"><header class="sheet-header"><div class="sheet-title">${back ? `<button class="icon-button" data-action="${back}" aria-label="返回">${icon('left')}</button>` : ''}<h2>${title}</h2></div><button class="icon-button" data-action="close-sheet" aria-label="关闭设置">${icon('close')}</button></header><div class="sheet-content">${body}</div><footer class="sheet-footer">${footer}</footer></section></div>`;
    setInert(); requestAnimationFrame(() => $('.sheet-header button')?.focus({preventScroll:true}));
  }
  function identity(a) { return `<div class="identity">${avatar(a.type)}<div><div class="identity-title">${a.type === 'whatsapp' ? 'WhatsApp' : '国际站'}</div><div class="identity-sub">账号尾号 ${a.tail || '—'}</div></div>${status(a)}</div>`; }
  function openSettings(id) {
    const a = account(id); draft = structuredClone(a); delete draft.contacts; baseline = JSON.stringify(draft); sheet = {type:'account', id}; renderSettings();
  }
  function merchantOptions(selected, empty = '不指定') { return `<option value="">${empty}</option>` + accounts.filter(a => a.type === 'international').map(m => `<option value="${m.id}" ${selected === m.id ? 'selected' : ''}>${esc(m.name)}</option>`).join(''); }
  function receptionFields() {
    return `<div class="compact-setting"><span>接待商家</span><div class="chips-box" id="merchant-chips">${draft.allowed.length ? draft.allowed.map(id => `<span class="chip">${esc(merchantName(id))}</span>`).join('') : '<span style="color:#a1a9b4;font-size:11px">未选择</span>'}<button class="choose-button" data-action="choose-merchants">选择</button></div></div><div class="merchant-picker" id="merchant-picker" hidden>${accounts.filter(a => a.type === 'international').map(m => `<label class="merchant-option"><input type="checkbox" data-merchant="${m.id}" ${draft.allowed.includes(m.id) ? 'checked' : ''}>${esc(m.name)}${m.status !== 'opened' ? '<small>未连接</small>' : ''}</label>`).join('')}</div><label class="compact-setting default-setting"><span>新联系人分配给</span><select id="default-merchant">${merchantOptions(draft.defaultMerchant)}</select><span class="field-help" id="default-changed" hidden>仅影响新联系人，现有分配保持不变。</span></label>`;
  }
  function renderSettings() {
    const a = account(sheet.id);
    const shared = `${identity(a)}<label class="field">${a.type === 'whatsapp' ? '账号名称' : '显示名称'}<input id="account-name" maxlength="100" value="${esc(draft.name)}" autocomplete="off"></label>`;
    let body;
    if (a.type === 'whatsapp') {
      body = `${shared}<div class="setting-divider"></div><div class="setting-row"><strong>自动接待</strong><button class="switch" role="switch" aria-label="自动接待" aria-checked="${draft.reception}" data-action="toggle-reception"><span></span></button></div><div id="reception-warning"></div><div class="reception-fields" id="reception-fields" ${!draft.reception ? 'hidden' : ''}>${receptionFields()}</div><button class="settings-link" data-action="contacts"><span>联系人分配</span><span class="trailing">${accountContacts().length} 位联系人</span>${icon('right')}</button><button class="settings-link" data-action="global-from-account"><span>接待模型</span><span class="trailing">${modelReady ? '已就绪' : '未配置'}</span>${icon('right')}</button><details class="advanced"><summary>更多设置 ${icon('down')}</summary><button class="settings-link" data-action="backup"><span>备份与恢复</span><span class="trailing"></span>${icon('right')}</button>${a.legacy !== 'ready' ? '<button class="settings-link" data-action="legacy"><span>历史接入记录</span><span class="trailing">需要确认</span>' + icon('right') + '</button>' : ''}<button class="settings-link" data-action="connection-details"><span>连接详情</span><span class="trailing"></span>${icon('right')}</button>${a.status === 'connected' || a.status === 'qr' ? '<button class="settings-link" data-action="disconnect"><span>断开连接</span><span class="trailing"></span>' + icon('right') + '</button>' : ''}</details>`;
    } else {
      body = `${shared}<div class="setting-row"><span>公司名称</span><span class="readonly-value">${esc(a.company)}</span></div><div class="setting-divider"></div><button class="settings-link" data-action="merchant-options"><span>接待设置</span><span class="trailing"></span>${icon('right')}</button><button class="settings-link" data-action="global-from-account"><span>接待模型</span><span class="trailing">${modelReady ? '已就绪' : '未配置'}</span>${icon('right')}</button><details class="advanced"><summary>更多设置 ${icon('down')}</summary><button class="settings-link" data-action="authorize" data-id="${a.id}"><span>重新授权</span><span class="trailing"></span>${icon('right')}</button><button class="settings-link" data-action="connection-details"><span>连接详情</span><span class="trailing"></span>${icon('right')}</button><button class="settings-link" data-action="data-location"><span>数据与备份</span><span class="trailing"></span>${icon('right')}</button></details>`;
    }
    sheetLayout('账号设置', body, button('取消','close-sheet') + button('保存','save-account','',true));
  }
  function closeSheet(force = false) {
    if (!force && draft && JSON.stringify(draft) !== baseline && sheet?.type !== 'pending') { showDialog('放弃修改？','<p>未保存的修改将不会保留。</p>',button('继续编辑','close-dialog') + button('放弃修改','discard','',true)); return; }
    $('#sheet-root').replaceChildren(); sheet = null; draft = null; contactDraft = null; setInert(); $('[data-action="add"]')?.focus({preventScroll:true});
  }
  function showDialog(title, body, actions = '', extra = '') {
    dialogReturnFocus = document.activeElement;
    $('#dialog-root').innerHTML = `<div class="overlay dialog-overlay" data-dismiss="dialog"><section class="dialog" role="dialog" aria-modal="true" aria-label="${title}" ${extra}><header class="dialog-heading"><h2>${title}</h2><button class="icon-button" data-action="close-dialog" aria-label="关闭弹窗">${icon('close')}</button></header>${body}${actions ? `<footer class="dialog-actions">${actions}</footer>` : ''}</section></div>`;
    setInert(); requestAnimationFrame(() => ($('.dialog [autofocus]') || $('.dialog-heading button'))?.focus({preventScroll:true}));
  }
  function closeDialog() { $('#dialog-root').replaceChildren(); setInert(); if (dialogReturnFocus?.isConnected) dialogReturnFocus.focus({preventScroll:true}); }
  function connect(id) {
    const target = account(id); target.status = 'qr'; target.reception = false; closeDialog(); closeSheet(true); renderHome();
    showDialog('等待扫码',`<div class="waiting-content"><div class="waiting-symbol">${icon('window')}</div><p>请在新窗口完成扫码</p></div>`,button('取消连接','cancel-connection',`data-id="${id}"`) + button('打开窗口','open-window',`data-id="${id}"`,true), `data-account-id="${id}"`);
  }
  const authorizationPreview = '请仅在允许启动此工作台的当前目标商家 Accio Work 授权 PowerShell 会话中执行以下命令。\n\n'
    + String.raw`Start-Process -FilePath '<安装位置>\ReceptionWorkbench.exe' -ArgumentList '"--connect-from-accio"'` + '\n\n'
    + '该命令启动本机当前版本后立即返回，请勿等待桌面进程退出。';
  function showAuthorization() {
    showDialog('账号授权', `<p>复制口令，在对应商家的 Accio Work 中运行。</p><div class="authorization-preview"><span>示例口令</span><code id="authorization-code">${esc(authorizationPreview)}</code></div>`, button('关闭','close-dialog') + button('复制口令','copy-authorization','',true));
  }
  async function copyAuthorization() {
    try {
      if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(authorizationPreview);
      else {
        const input = document.createElement('textarea'); input.value = authorizationPreview; input.style.cssText = 'position:fixed;opacity:0;pointer-events:none'; document.body.append(input); input.select();
        try { if (!document.execCommand('copy')) throw new Error('copy unavailable'); } finally { input.remove(); }
      }
      toast('示例口令已复制');
    } catch { toast('复制未完成，请手动复制口令'); }
  }
  function globalSettings() {
    sheet = {type:'global'}; draft = null; baseline = '';
    sheetLayout('设置',`<div class="simple-label">模型</div><label class="field">接待模型<select id="global-reception"><option value="">未选择</option><option value="vision" ${modelReady ? 'selected' : ''}>通用视觉</option></select></label><label class="field">翻译模型<select><option>轻量翻译</option><option>通用视觉</option></select></label><button class="settings-link" data-action="api-list"><span>API 配置</span><span class="trailing">2 个</span>${icon('right')}</button><details class="advanced"><summary>更多设置 ${icon('down')}</summary><button class="settings-link" data-action="import"><span>导入已有账号</span><span class="trailing"></span>${icon('right')}</button><button class="settings-link" data-action="about"><span>关于</span><span class="trailing">0.4.1</span>${icon('right')}</button></details>`,button('取消','close-sheet') + button('保存','save-global','',true));
  }
  function renderContacts(query = '') {
    sheet.type = 'contacts';
    sheetLayout('联系人分配',`<div class="search-wrap">${icon('search')}<input class="search-input" id="contact-search" placeholder="搜索联系人" aria-label="搜索联系人" value="${esc(query)}"></div><div class="contact-filter"><span>联系人</span><span>接待商家</span></div><div id="contact-list">${contactRows(query)}</div>`,button('完成','back-account'), 'back-account');
  }
  function contactRows(query) { return accountContacts().filter(c => c.name.toLowerCase().includes(query.toLowerCase())).map(c => `<button class="contact-row" data-action="contact-edit" data-id="${c.id}"><span class="contact-avatar">${c.name[0]}</span><span class="contact-copy"><span class="contact-name">${c.name}</span><span class="contact-merchant" style="display:block">${esc(merchantName(c.merchant))}</span></span>${c.paused ? '<span class="contact-paused">已暂停</span>' : ''}${icon('right')}</button>`).join('') || '<p style="color:#a1a9b5;font-size:12px;padding-top:20px">没有匹配的联系人</p>'; }
  function editContact(id) {
    const c = accountContacts().find(c => c.id === id); contactDraft = structuredClone(c); sheet.type = 'contact';
    sheetLayout('联系人设置',`<div class="contact-status"><span class="contact-avatar">${c.name[0]}</span><span class="contact-name">${c.name}</span></div><label class="field">接待商家<select id="contact-merchant">${merchantOptions(c.merchant,'不分配')}</select></label><div class="setting-row"><span>自动接待</span><button class="switch" role="switch" aria-label="联系人自动接待" aria-checked="${!c.paused}" data-action="toggle-contact"><span></span></button></div><div id="contact-change-notice"></div>`,button('取消','contacts') + button('保存','save-contact','',true),'contacts');
  }
  function renderPending(id) {
    sheet = {type:'pending', id}; draft = null;
    sheetLayout('发送核查',`<div class="operation"><div class="operation-person"><span>Alex</span><time>今天 10:42</time></div><div class="message-bubble">We’ll confirm the details shortly.</div><div class="operation-bottom"><span class="badge-warning">结果待核查</span>${button('核查结果','check-send',`data-id="${id}"`)}</div></div>`,button('关闭','close-sheet'));
  }
  function saveAccount() {
    if (!draft.name.trim()) { $('#account-name').focus(); toast('请输入账号名称'); return; }
    const current = account(sheet.id);
    if (draft.type === 'whatsapp' && draft.reception && (!modelReady || current.status !== 'connected' || !draft.allowed.length || current.legacy !== 'ready')) {
      $('#reception-warning').innerHTML = `<div class="inline-alert">${!modelReady ? '请先配置接待模型。' : current.status !== 'connected' ? '请先连接账号。' : !draft.allowed.length ? '请选择接待商家。' : '开启前需要确认历史接入记录。'}<br><button class="text-button" data-action="${!modelReady ? 'global-from-account' : current.status !== 'connected' ? 'connect-edited' : !draft.allowed.length ? 'choose-merchants' : 'legacy'}">${!modelReady ? '前往设置' : current.status !== 'connected' ? '连接' : !draft.allowed.length ? '选择商家' : '去确认'} ${icon('right')}</button></div>`; return;
    }
    if (draft.type === 'whatsapp' && draft.reception && (!current.reception || JSON.stringify(draft.allowed) !== JSON.stringify(current.allowed))) {
      pendingSave = structuredClone(draft);
      showDialog('开启自动接待？',`<p>${esc(draft.name)}将为以下商家接待客户：</p><div class="subtle-block">${draft.allowed.map(merchantName).map(esc).join('、')}</div>`,button('取消','close-dialog') + button('开启','confirm-reception','',true)); return;
    }
    Object.assign(current, draft, {name:draft.name.trim()}); closeSheet(true); renderHome(); toast('已保存');
  }
  function applyScenario(name) {
    clearTimeout(toastTimer); $('#toast').hidden = true;
    closeDialog(); closeSheet(true); accounts = fixtures(); modelReady = true; filter = 'all';
    if (name === 'multi') { Object.assign(account('wa-support'), {status:'connected',reception:true,allowed:['intl-home'],defaultMerchant:'intl-home'}); }
    if (name === 'qr') { account('wa-sales').status = 'qr'; account('wa-sales').reception = false; }
    if (name === 'error') { account('wa-sales').status = 'error'; account('wa-sales').reception = false; }
    if (name === 'pending') { account('wa-sales').pending = 1; }
    if (name === 'model') { modelReady = false; accounts.forEach(a => a.reception = false); }
    document.querySelectorAll('[data-scenario]').forEach(b => b.setAttribute('aria-pressed',String(b.dataset.scenario === name))); renderHome();
  }
  document.addEventListener('click', event => {
    const scene = event.target.closest('[data-scenario]'); if (scene) { applyScenario(scene.dataset.scenario); return; }
    const target = event.target.closest('[data-action]');
    if (!target) { if (event.target.dataset.dismiss === 'sheet') closeSheet(); if (event.target.dataset.dismiss === 'dialog') closeDialog(); return; }
    const action = target.dataset.action, id = target.dataset.id;
    if (action === 'filter') { filter = target.dataset.filter; renderHome(); $(`[data-filter="${filter}"]`)?.focus(); }
    else if (action === 'edit') openSettings(id);
    else if (action === 'close-sheet') closeSheet();
    else if (action === 'close-dialog') closeDialog();
    else if (action === 'discard') { closeDialog(); closeSheet(true); }
    else if (action === 'save-account') saveAccount();
    else if (action === 'open') { const a = account(id); if (a.type === 'international') { if (a.status === 'opened') toast('窗口已打开'); else showAuthorization(); } else if (['connected','qr'].includes(a.status)) toast('窗口已打开'); else connect(id); }
    else if (action === 'open-window') toast('窗口已打开');
    else if (action === 'cancel-connection') { account(id).status='disconnected'; closeDialog(); renderHome(); }
    else if (action === 'complete-scan') { const waitingId = $('.dialog[data-account-id]')?.dataset.accountId; const a = waitingId ? account(waitingId) : accounts.find(a => a.status === 'qr'); if (!a) { toast('当前没有等待扫码的账号'); return; } a.status='connected'; closeDialog(); renderHome(); toast('已连接'); }
    else if (action === 'global-settings') globalSettings();
    else if (action === 'global-from-account') { if (draft && JSON.stringify(draft)!==baseline) { showDialog('打开模型设置？','<p>请先保存当前账号的修改，或放弃修改后继续。</p>',button('继续编辑','close-dialog') + button('放弃并打开','discard-to-global','',true)); } else globalSettings(); }
    else if (action === 'discard-to-global') { closeDialog(); globalSettings(); }
    else if (action === 'save-global') { const next=!!$('#global-reception').value; if(next!==modelReady&&accounts.some(a=>a.reception)){showDialog('保存模型设置？','<p>保存后将暂停所有账号的自动接待。</p>',button('取消','close-dialog')+button('保存','confirm-global',`data-ready="${next}"`,true));}else{modelReady=next;closeSheet(true);renderHome();toast('设置已保存');} }
    else if (action === 'confirm-global') { modelReady=target.dataset.ready==='true';accounts.forEach(a=>a.reception=false);closeDialog();closeSheet(true);renderHome();toast('设置已保存，自动接待已暂停'); }
    else if (action === 'api-list') sheetLayout('API 配置','<div class="api-row"><div>通用视觉<small>接待 · 图文</small></div><span class="status good"><span class="status-dot"></span>可用</span></div><div class="api-row"><div>轻量翻译<small>翻译 · 文字</small></div><span class="status good"><span class="status-dot"></span>可用</span></div>',button('完成','global-settings'),'global-settings');
    else if (action === 'toggle-reception') { draft.reception=!draft.reception; target.setAttribute('aria-checked',String(draft.reception)); $('#reception-fields').hidden = !draft.reception; $('#reception-warning').innerHTML = ''; }
    else if (action === 'choose-merchants') { if ($('#merchant-picker')) $('#merchant-picker').hidden = !$('#merchant-picker').hidden; }
    else if (action === 'contacts') { if (!account(sheet.id).status || account(sheet.id).status !== 'connected') { toast('请先连接账号'); return; } renderContacts(); }
    else if (action === 'back-account') { sheet.type='account'; renderSettings(); }
    else if (action === 'contact-edit') editContact(id);
    else if (action === 'toggle-contact') { contactDraft.paused=!contactDraft.paused; target.setAttribute('aria-checked',String(!contactDraft.paused)); }
    else if (action === 'save-contact') { const c=accountContacts().find(c=>c.id===contactDraft.id); const changed=c.merchant!==contactDraft.merchant; Object.assign(c,contactDraft); if(changed)c.paused=true; renderContacts(); toast(changed?'分配已保存，自动接待已暂停':'已保存'); }
    else if (action === 'pending') renderPending(id);
    else if (action === 'check-send') { target.disabled=true; target.textContent='正在核查…'; setTimeout(()=> { account(id).pending=0; if(sheet?.type==='pending' && sheet.id===id)closeSheet(true); renderHome(); toast('已确认发送结果'); },800); }
    else if (action === 'connect-edited') connect(sheet.id);
    else if (action === 'disconnect') showDialog('断开连接？',`<p>${esc(account(sheet.id).name)}的自动接待将暂停。</p>`,button('取消','close-dialog') + button('断开连接','confirm-disconnect','',true));
    else if (action === 'confirm-disconnect') { const a=account(sheet.id); a.status='disconnected';a.reception=false; closeDialog();closeSheet(true);renderHome();toast('已断开连接'); }
    else if (action === 'confirm-reception') { Object.assign(account(pendingSave.id),pendingSave); pendingSave=null;closeDialog();closeSheet(true);renderHome();toast('自动接待已开启'); }
    else if (action === 'add') showDialog('添加账号',`<button class="type-choice" data-action="add-international">${avatar('international')}<span><strong>国际站</strong><small>添加商家账号</small></span>${icon('right')}</button><button class="type-choice" data-action="add-whatsapp">${avatar('whatsapp')}<span><strong>WhatsApp</strong><small>扫码登录</small></span>${icon('right')}</button>`);
    else if (action === 'add-whatsapp') showDialog('添加 WhatsApp','<label class="field">账号名称<input id="new-account-name" autofocus placeholder="例如：海外业务" maxlength="100" autocomplete="off"></label>',button('取消','close-dialog')+button('连接','create-whatsapp','',true));
    else if (action === 'create-whatsapp') { const name=$('#new-account-name').value.trim(); if(!name){$('#new-account-name').focus();return;}const id='wa-'+Date.now();accounts.push({id,type:'whatsapp',name,tail:'',status:'disconnected',reception:false,allowed:[],defaultMerchant:'',legacy:'ready',pending:0,contacts:[]});filter='all';renderHome();connect(id); }
    else if (action === 'add-international' || action === 'authorize') showAuthorization();
    else if (action === 'copy-authorization') void copyAuthorization();
    else if (action === 'connection-details') showDialog('连接详情',`<div class="setting-row"><span>连接状态</span>${status(account(sheet.id))}</div><div class="setting-row"><span>自动接待</span><span class="readonly-value">${account(sheet.id).reception?'已开启':'已暂停'}</span></div>`,button('关闭','close-dialog','',true));
    else if (action === 'merchant-options') { const a=account(sheet.id); if(a.status!=='opened'){toast('请先授权账号');return;}showDialog('接待设置','<p>在账号窗口中管理接待范围、规则和资料。</p>',button('关闭','close-dialog')+button('打开窗口','open-window','',true)); }
    else if (action === 'backup' || action === 'data-location') showDialog('备份与恢复','<div class="setting-row"><span>业务数据</span><span class="readonly-value">保存在本机</span></div><div class="subtle-block">请在账号断开连接后进行备份或恢复。</div>',button('关闭','close-dialog','',true));
    else if (action === 'legacy') showDialog('历史接入记录','<p>开启自动接待前，需要确认之前的发送记录。</p>',button('取消','close-dialog')+button('检查','check-legacy','',true));
    else if (action === 'check-legacy') { account(sheet.id).legacy='ready'; draft.legacy='ready'; closeDialog(); renderSettings();toast('记录已确认'); }
    else if (action === 'import') showDialog('导入已有账号','<p>选择之前使用的商家登记目录。</p>',button('关闭','close-dialog','',true));
    else if (action === 'about') showDialog('接待工作台','<p>版本 0.4.1</p>',button('关闭','close-dialog','',true));
    else if (action === 'narrow') { const active=$('#studio').classList.toggle('narrow');target.setAttribute('aria-pressed',String(active)); }
  });
  document.addEventListener('input',event=>{
    if(event.target.id==='account-name'&&draft)draft.name=event.target.value;
    if(event.target.id==='contact-search')$('#contact-list').innerHTML=contactRows(event.target.value);
  });
  document.addEventListener('change',event=>{
    if(event.target.dataset.merchant&&draft){const id=event.target.dataset.merchant;draft.allowed=event.target.checked?[...new Set([...draft.allowed,id])]:draft.allowed.filter(m=>m!==id);$('#merchant-chips').innerHTML=`${draft.allowed.length?draft.allowed.map(id=>`<span class="chip">${esc(merchantName(id))}</span>`).join(''):'<span style="color:#a1a9b4;font-size:11px">未选择</span>'}<button class="choose-button" data-action="choose-merchants">选择</button>`;}
    if(event.target.id==='default-merchant'){draft.defaultMerchant=event.target.value;$('#default-changed').hidden=draft.defaultMerchant===account(sheet.id).defaultMerchant;}
    if(event.target.id==='contact-merchant'){contactDraft.merchant=event.target.value;const changed=contactDraft.merchant!==accountContacts().find(c=>c.id===contactDraft.id).merchant;$('#contact-change-notice').innerHTML=changed?'<div class="inline-alert">保存后将暂停该联系人的自动接待。</div>':'';}
  });
  document.addEventListener('keydown',event=>{
    if(event.key==='Escape'){if($('#dialog-root').firstChild)closeDialog();else if($('#sheet-root').firstChild)closeSheet();}
    const tab=event.target.closest('[role="tab"]');if(tab&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const ids=['all','international','whatsapp'];const n=ids.indexOf(filter);filter=ids[event.key==='Home'?0:event.key==='End'?2:(n+(event.key==='ArrowRight'?1:2))%3];renderHome();$(`[data-filter="${filter}"]`).focus();}
    if(event.key==='Tab'){const panel=$('#dialog-root [role="dialog"]')||$('#sheet-root [role="dialog"]');if(!panel)return;const all=[...panel.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),summary')].filter(e=>e.getClientRects().length);if(!all.length)return;const first=all[0],last=all.at(-1);if(event.shiftKey&&document.activeElement===first){last.focus();event.preventDefault();}else if(!event.shiftKey&&document.activeElement===last){first.focus();event.preventDefault();}}
  });
  renderHome();
})();
</script>
</body>
</html>
