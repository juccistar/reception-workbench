<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>客户侧栏 · 交互设计稿</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;color:#303943;background:#f4f5f7;font-synthesis:none;--line:#e9edf0;--muted:#89939d}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button,input,select,textarea{outline:none}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #829a91;outline-offset:2px}button:disabled{opacity:.4;cursor:default}h1,h2,h3,p{margin:0}button{color:inherit}[hidden]{display:none!important}.studio{max-width:1336px;margin:auto;padding:26px 24px}.studio-heading{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#8e97a3;margin:0 2px 15px}.studio-heading a{color:#7e8b99;text-decoration:none}.browser{height:744px;background:white;border:1px solid #e0e5e9;border-radius:12px;overflow:hidden;box-shadow:0 20px 60px #1e283514;display:flex;flex-direction:column;position:relative}.browser-tabs{height:34px;background:#edf0f3;display:flex;align-items:center;padding:0 12px;gap:8px;flex:none}.browser-tab{align-self:end;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0;background:#fff;font-size:11px;padding:9px 14px;width:220px}.wa-dot{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#48a67d;color:white;font-size:10px}.tab-close{margin-left:auto;color:#a2aab2}.browser-toolbar{display:flex;align-items:center;gap:15px;height:43px;padding:6px 16px;border-bottom:1px solid #e6e9ed;color:#9ca6b0;font-size:14px;flex:none}.address{height:29px;background:#f3f5f7;border-radius:17px;padding:6px 13px;flex:1;font-size:11px;color:#828d99}.workspace{display:grid;grid-template-columns:224px minmax(0,1fr) 324px;flex:1;min-height:0}.contacts{border-right:1px solid #e1e6e8;display:flex;flex-direction:column;background:#fff}.contacts-head{height:65px;display:flex;align-items:center;gap:10px;padding:15px 16px;background:#f5f7f8;border-bottom:1px solid #e9ecef}.account-avatar{width:30px;height:30px;display:grid;place-items:center;background:#e4ece7;color:#6c887a;border-radius:50%;font-size:12px}.account-title{font-size:13px;font-weight:600}.contacts-title{font-size:10px;color:#9ba5af;padding:18px 16px 10px}.chat-person{display:flex;align-items:center;gap:11px;border:0;border-bottom:1px solid #f1f3f5;padding:16px;width:100%;background:#fff;text-align:left}.chat-person[aria-current=true]{background:#eef5f1}.contact-avatar{width:34px;height:34px;background:#ecf0f2;color:#8a96a0;border-radius:50%;display:grid;place-items:center;flex:none;font-size:13px}.person-name{display:block;font-size:12px;color:#44515d;font-weight:550}.person-message{display:block;margin-top:6px;font-size:10px;color:#9aa5ae;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}.conversation{display:flex;flex-direction:column;min-width:0;background:#f2efe9}.conversation-head{height:65px;flex:none;display:flex;align-items:center;gap:11px;padding:14px 19px;background:#f5f7f8;border-bottom:1px solid #e2e8e5}.conversation-title{font-size:13px;font-weight:550}.conversation-presence{font-size:10px;color:#9aa5ac;margin-top:5px}.panel-toggle{margin-left:auto;border:1px solid #dce5e1;border-radius:6px;background:white;font-size:11px;color:#6b7e75;padding:8px 10px;white-space:nowrap}.thread{flex:1;min-height:0;overflow:auto;padding:28px 26px;display:flex;flex-direction:column;justify-content:flex-end;gap:17px;background-image:radial-gradient(#d6d9d270 .65px,transparent .65px);background-size:13px 13px}.day-label{align-self:center;font-size:10px;color:#8c9896;background:#fff9;border-radius:6px;padding:5px 12px;margin-bottom:12px}.bubble{max-width:85%;background:white;border-radius:0 9px 9px 9px;padding:12px 13px;box-shadow:0 1px 1px #71847813;font-size:12px;line-height:1.8;color:#56635f}.bubble.mine{align-self:flex-end;border-radius:9px 0 9px 9px;background:#dff0df}.bubble time{display:block;text-align:right;font-size:9px;color:#9aa8a0;margin-top:5px}.composer{height:64px;background:#f4f6f6;display:flex;align-items:center;gap:15px;padding:12px 18px;color:#8f9d98;font-size:22px}.composer-input{height:37px;flex:1;min-width:0;display:flex;align-items:center;background:white;border:1px solid #e8ece9;border-radius:8px;font-size:11px;color:#a6b0ad;padding:0 13px}.customer-panel{min-width:0;background:#fff;border-left:1px solid #e0e6ea;display:flex;flex-direction:column}.panel-head{height:65px;display:flex;align-items:center;justify-content:space-between;flex:none;padding:17px 21px;border-bottom:1px solid var(--line)}.panel-head h1{font-size:15px;font-weight:600}.icon-button{width:26px;height:26px;border:0;background:none;font-size:20px;color:#9ba6b2;border-radius:5px}.icon-button:hover{background:#f1f4f6}.panel-body{flex:1;min-height:0;overflow:auto;padding:23px 21px}.profile{display:flex;align-items:center;gap:12px;margin-bottom:26px}.profile .contact-avatar{width:40px;height:40px;font-size:16px}.profile-name{font-size:15px;font-weight:600}.profile-sub{font-size:10px;color:#a0a9b3;margin-top:6px}.field{display:flex;flex-direction:column;gap:10px;font-size:11px;color:#85909d;margin-bottom:21px}.field select{height:36px;border:1px solid #dfe5eb;border-radius:6px;background:white;padding:7px 10px;color:#5c6978;font-size:12px;min-width:0;width:100%}.association{border:1px solid #e1e7ed;border-radius:8px;padding:13px;background:#fafbfc}.association strong{display:block;font-size:12px;font-weight:550;color:#637284}.association small{display:block;font-size:10px;color:#a0aab6;margin-top:7px}.association-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.text-button{border:0;background:none;font-size:11px;color:#688974;padding:3px 0;white-space:nowrap}.text-button:hover{text-decoration:underline}.associate-button{display:flex;align-items:center;justify-content:space-between;width:100%;border:1px dashed #cfdad4;border-radius:7px;padding:11px 12px;color:#7a9184;background:#fcfefc;font-size:11px}.binding-actions{display:flex;justify-content:flex-end;margin-top:-7px;margin-bottom:23px}.button{min-height:33px;padding:7px 12px;font-size:11px;background:white;border:1px solid #dae2e8;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}.button.primary{background:#3e6d58;border-color:#3e6d58;color:#fff}.button:hover{filter:brightness(.97)}.divider{height:1px;background:var(--line);margin:23px 0}.section-label{font-size:11px;color:#8a96a3;font-weight:500;margin-bottom:12px}.summary{font-size:12px;line-height:1.9;color:#6e7e8e}.fact{display:flex;justify-content:space-between;gap:10px;font-size:11px;padding:10px 0;color:#9aa5b0}.fact span:last-child{color:#6a7c89;text-align:right}.panel-footer{flex:none;padding:17px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.reception-status{font-size:11px;display:flex;align-items:center;gap:6px;color:#6e9482}.reception-status:before{content:'';display:block;width:5px;height:5px;border-radius:50%;background:#6aab8a}.reception-status.paused{color:#a69676}.reception-status.paused:before{background:#c0a878}.workspace.collapsed{grid-template-columns:224px minmax(0,1fr)}.workspace.collapsed .customer-panel{display:none}.picker{border:1px solid #dce4eb;border-radius:8px;background:white;box-shadow:0 6px 24px #2c405112;margin-top:9px;overflow:hidden}.picker-search{margin:11px;border:1px solid #e2e7ed;border-radius:6px;padding:9px 10px;font-size:11px;width:calc(100% - 22px);color:#6c7b8b}.customer-option{display:block;width:100%;padding:13px 12px;text-align:left;border:0;border-top:1px solid #f0f2f5;background:white}.customer-option:hover{background:#f5f9f6}.customer-option strong{display:block;font-size:11px;color:#677a8a;font-weight:550}.customer-option small{display:block;font-size:10px;color:#a2aebb;margin-top:6px}.picker-empty{font-size:11px;color:#9eabb8;padding:14px}.panel-alert{font-size:10px;color:#a18b62;line-height:1.8;background:#fcf8ef;border:1px solid #f0e6ce;border-radius:6px;padding:10px;margin-top:-5px;margin-bottom:18px}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:#fff;background:#35483f;box-shadow:0 5px 18px #27352d20;font-size:12px;border-radius:7px;padding:10px 16px;z-index:20;white-space:nowrap}.modal-overlay{position:absolute;inset:77px 0 0;background:#27352f35;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}.modal{background:white;border-radius:11px;padding:24px;width:330px;max-width:100%;box-shadow:0 18px 48px #17271f20}.modal h2{font-size:15px;font-weight:600;margin-bottom:16px}.modal p{font-size:12px;line-height:1.9;color:#89968e}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.prototype-note{font-size:11px;color:#a1aab4;text-align:center;margin-top:17px;line-height:1.8}.prototype-note a{color:#7d8f9e;text-decoration:none}
@media(max-width:1050px){.workspace{grid-template-columns:182px minmax(0,1fr) 300px}.contacts-head,.chat-person{padding-left:12px;padding-right:12px}.person-message{max-width:105px}.panel-head{padding-left:18px;padding-right:18px}.panel-body{padding-left:18px;padding-right:18px}.thread{padding:24px 18px}.workspace.collapsed{grid-template-columns:182px minmax(0,1fr)}}
@media(max-width:780px){.studio{padding:14px 10px}.studio-heading{font-size:10px}.browser{height:780px}.workspace{grid-template-columns:minmax(0,1fr);position:relative}.contacts{display:none}.customer-panel{position:absolute;right:0;top:0;bottom:0;width:304px;max-width:85%;box-shadow:-10px 0 30px #213a2e19}.workspace.collapsed{grid-template-columns:minmax(0,1fr)}.conversation-head{padding-left:15px}.panel-toggle{font-size:10px}.browser-toolbar{padding-left:12px;padding-right:12px}.prototype-note{font-size:10px}}
.workspace{grid-template-rows:minmax(0,1fr)}.contacts,.conversation,.customer-panel{min-height:0}.customer-panel{overflow:hidden}
</style>
</head>
<body>
<div class="studio"><div class="studio-heading"><span>聊天窗口 · 客户侧栏设计稿</span><a href="index.html">返回启动台设计稿 ↗</a></div>
<main class="browser" id="browser" aria-label="聊天窗口侧栏设计预览">
  <div class="browser-tabs" aria-hidden="true"><div class="browser-tab"><span class="wa-dot">◔</span>WhatsApp<span class="tab-close">×</span></div><span>＋</span></div>
  <div class="browser-toolbar" aria-hidden="true"><span>‹</span><span>›</span><span>↻</span><div class="address">⌕ &nbsp; web.whatsapp.com</div><span>⋮</span></div>
  <div class="workspace" id="workspace">
    <aside class="contacts" aria-label="聊天列表"><div class="contacts-head"><span class="account-avatar">海</span><span class="account-title">海外业务</span></div><div class="contacts-title">聊天</div><div id="chat-list"></div></aside>
    <section class="conversation" aria-label="当前聊天示意"><header class="conversation-head"><span class="contact-avatar" id="chat-avatar">A</span><div><div class="conversation-title" id="chat-name">Alex</div><div class="conversation-presence">在线</div></div><button class="panel-toggle" id="panel-toggle">客户信息</button></header><div class="thread" id="thread"></div><div class="composer" aria-hidden="true"><span>＋</span><div class="composer-input">输入消息</div><span>◌</span></div></section>
    <aside class="customer-panel" id="customer-panel" aria-label="客户信息侧栏"></aside>
  </div>
  <div class="toast" id="toast" role="status" hidden></div><div id="modal-root"></div>
</main>
<p class="prototype-note">独立交互设计稿，聊天与客户均为示例。<a href="index.html">启动台预览</a> · 原网页聊天区域仅作位置示意，侧栏操作未接入真实账号。</p>
</div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const merchants = {'intl-home':'星野家居','intl-factory':'山禾制造'};
  const people = {
    alex:{id:'alex',name:'Alex',merchant:'intl-home',customer:null,paused:false,summary:'关注包装与交期，等待确认可选方案。',product:'收纳盒 · 500 件',focus:'包装、交期'},
    morgan:{id:'morgan',name:'Morgan',merchant:'intl-factory',customer:null,paused:true,summary:'询问工具套装的规格，尚未确认数量。',product:'工具套装',focus:'规格、数量'},
    taylor:{id:'taylor',name:'Taylor',merchant:'intl-home',customer:null,paused:true,summary:'首次沟通，等待补充采购需求。',product:'待补充',focus:'产品用途'}
  };
  const customers = {
    'intl-home':[{id:'northside',name:'Alex Jordan',company:'Northside Home'},{id:'bright',name:'Alex Rivera',company:'Bright Home'}],
    'intl-factory':[{id:'maple',name:'Morgan Lee',company:'Maple Tools'}]
  };
  let selected='alex', draft=null, picker=null, timer;
  const current = () => people[selected];
  const modified = () => draft.merchant!==current().merchant || draft.customer?.id!==current().customer?.id;
  function toast(text){clearTimeout(timer);$('#toast').textContent=text;$('#toast').hidden=false;timer=setTimeout(()=>$('#toast').hidden=true,2200);}
  function renderChat(){
    $('#chat-list').innerHTML=Object.values(people).map(p=>`<button class="chat-person" data-chat="${p.id}" aria-current="${p.id===selected}"><span class="contact-avatar">${p.name[0]}</span><span><strong class="person-name">${p.name}</strong><span class="person-message">${p.id==='alex'?'Packaging options':p.id==='morgan'?'About the specifications':'Hello, nice to meet you'}</span></span></button>`).join('');
    $('#chat-name').textContent=current().name;$('#chat-avatar').textContent=current().name[0];
    const messages=selected==='alex'?['Hi, we’re looking for 500 storage boxes.','Sure. I’ll check the available options.','Could you confirm the packaging options?']:selected==='morgan'?['Could you share the specifications?','I’ll check the details for you.']:['Hello, nice to meet you.','Hi! What are you looking for?'];
    $('#thread').innerHTML='<span class="day-label">今天</span>'+messages.map((m,i)=>`<div class="bubble ${i%2?'mine':''}">${esc(m)}<time>10:${38+i*2}</time></div>`).join('');
  }
  function renderPanel(){
    const p=current();
    $('#customer-panel').innerHTML=`<header class="panel-head"><h1>客户信息</h1><button class="icon-button" id="close-panel" aria-label="收起客户侧栏">×</button></header><div class="panel-body"><div class="profile"><span class="contact-avatar">${p.name[0]}</span><div><div class="profile-name">${p.name}</div><div class="profile-sub">WhatsApp · 当前聊天</div></div></div><label class="field">接待商家<select id="merchant">${Object.entries(merchants).map(([id,name])=>`<option value="${id}" ${draft.merchant===id?'selected':''}>${name}</option>`).join('')}</select></label><div class="field"><span>国际站客户</span>${draft.customer?`<div class="association"><div class="association-row"><strong>${esc(draft.customer.company)}</strong><button class="text-button" data-action="associate">更换</button></div><small>${esc(draft.customer.name)}</small></div>`:'<button class="associate-button" data-action="associate">关联客户<span>＋</span></button>'}<div id="picker-root"></div></div>${modified()?'<div class="binding-actions" style="gap:8px"><button class="button" data-action="discard-binding">取消</button><button class="button primary" data-action="save-binding">保存关联</button></div>':''}${draft.merchant!==p.merchant?'<div class="panel-alert">保存后将暂停该客户的自动接待。</div>':''}<div class="divider"></div><h2 class="section-label">客户摘要</h2><p class="summary">${p.summary}</p><div class="divider"></div><h2 class="section-label">最近需求</h2><div class="fact"><span>产品</span><span>${p.product}</span></div><div class="fact"><span>关注项</span><span>${p.focus}</span></div><div class="fact"><span>最近沟通</span><span>今天 10:42</span></div></div><footer class="panel-footer"><span class="reception-status ${p.paused?'paused':''}">${p.paused?'已暂停':'自动接待中'}</span><button class="button" data-action="takeover">${p.paused?'恢复接待':'人工接管'}</button></footer>`;
  }
  function selectChat(id){selected=id;draft={merchant:current().merchant,customer:current().customer};picker=null;renderChat();renderPanel();}
  function showPicker(){picker={owner:selected,merchant:draft.merchant};$('#picker-root').innerHTML='<div class="picker"><input class="picker-search" id="customer-search" aria-label="搜索国际站客户" placeholder="搜索客户或公司"><div id="customer-results"></div></div>';renderResults('');$('#customer-search').focus();}
  function renderResults(query){const rows=(customers[picker.merchant]||[]).filter(c=>(c.name+' '+c.company).toLowerCase().includes(query.toLowerCase()));$('#customer-results').innerHTML=rows.length?rows.map(c=>`<button class="customer-option" data-customer="${c.id}"><strong>${esc(c.company)}</strong><small>${esc(c.name)}</small></button>`).join(''):'<p class="picker-empty">没有匹配的客户</p>';}
  function saveBinding(){const p=current();p.merchant=draft.merchant;p.customer=draft.customer;picker=null;renderPanel();toast('关联已保存');}
  document.addEventListener('click',e=>{
    const chat=e.target.closest('[data-chat]');if(chat){if(modified()){toast('请先保存当前客户的关联修改');return;}selectChat(chat.dataset.chat);return;}
    if(e.target.closest('#panel-toggle')){$('#workspace').classList.toggle('collapsed');return;}
    if(e.target.closest('#close-panel')){$('#workspace').classList.add('collapsed');return;}
    const c=e.target.closest('[data-customer]');if(c){if(!picker||picker.owner!==selected||picker.merchant!==draft.merchant){toast('客户已变更，请重新选择');return;}draft.customer=customers[picker.merchant].find(p=>p.id===c.dataset.customer);picker=null;renderPanel();return;}
    const action=e.target.closest('[data-action]')?.dataset.action;
    if(action==='associate')showPicker();
    if(action==='discard-binding'){draft={merchant:current().merchant,customer:current().customer};picker=null;renderPanel();}
    if(action==='save-binding'){
      if(draft.merchant!==current().merchant){$('#modal-root').innerHTML='<div class="modal-overlay"><section class="modal" role="dialog" aria-modal="true" aria-label="更改接待商家"><h2>更改接待商家？</h2><p>保存后将暂停该客户的自动接待。</p><div class="modal-actions"><button class="button" data-action="cancel-change">取消</button><button class="button primary" data-action="confirm-change">保存</button></div></section></div>';$('#workspace').inert=true;}
      else saveBinding();
    }
    if(action==='cancel-change'){$('#modal-root').replaceChildren();$('#workspace').inert=false;}
    if(action==='confirm-change'){current().paused=true;$('#modal-root').replaceChildren();$('#workspace').inert=false;saveBinding();}
    if(action==='takeover'){if(modified()){toast('请先保存关联修改');return;}current().paused=!current().paused;renderPanel();toast(current().paused?'已转为人工接待':'自动接待已恢复');}
  });
  document.addEventListener('change',e=>{if(e.target.id==='merchant'){draft.merchant=e.target.value;draft.customer=null;picker=null;renderPanel();}});
  document.addEventListener('input',e=>{if(e.target.id==='customer-search')renderResults(e.target.value);});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal-root').firstChild){$('#modal-root').replaceChildren();$('#workspace').inert=false;}else if(picker){picker=null;renderPanel();}else $('#workspace').classList.add('collapsed');}});
  selectChat('alex');
})();
</script>
</body>
</html>
